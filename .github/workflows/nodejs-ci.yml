
name: Node.js CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node.js version
        run: |
          node --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 24) { console.error(`Expected Node.js 24, got ${process.versions.node}`); process.exit(1); }'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify application entry point
        run: test -f server.js

      - name: Start application and check health endpoint
        run: |
          npm start > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 1
          done

          echo "Application did not become healthy. Application logs:"
          cat app.log
          exit 1
